services:
  - type: web
    name: stockpulse
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: primary
      - key: AI_PROVIDER
        value: internal
